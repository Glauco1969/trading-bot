<!doctype html>

<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Traidbolt — Painel</title>
  <!-- Tailwind CDN (play) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Small helper for log box scroll */
    .log-box { max-height: 220px; overflow-y: auto; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
  <div class="min-h-screen p-6">
    <header class="max-w-6xl mx-auto mb-6">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">Traidbolt — Painel</h1>
        <div class="text-sm text-slate-400">Conectado: <span id="conn-ip">—</span></div>
      </div>
      <p class="text-slate-400 mt-1">Status em tempo real — atualiza automaticamente a cada 5s</p>
    </header><main class="max-w-6xl mx-auto grid gap-6 grid-cols-1 md:grid-cols-3">
  <!-- Left column: metrics + controls -->
  <section class="md:col-span-1 bg-slate-800 rounded-2xl p-4 shadow-lg">
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm text-slate-400">Saldo (principal)</div>
          <div id="balance" class="text-2xl font-semibold">0.000 SOL</div>
        </div>
        <div class="text-right">
          <div class="text-sm text-slate-400">Lucro / Dia</div>
          <div id="pnl" class="text-xl font-semibold text-emerald-400">0.00%</div>
        </div>
      </div>

      <div class="bg-slate-700 p-3 rounded-lg">
        <div class="flex items-center justify-between">
          <div class="text-sm">Auto Trade</div>
          <div id="autostatus" class="text-sm font-medium text-slate-200">OFF</div>
        </div>
        <div class="mt-3 grid grid-cols-2 gap-2">
          <button id="btn-start" class="py-2 px-3 rounded-lg bg-emerald-500 hover:bg-emerald-600">▶️ Iniciar</button>
          <button id="btn-stop" class="py-2 px-3 rounded-lg bg-rose-500 hover:bg-rose-600">⏸️ Parar</button>
          <button id="btn-reinvest" class="py-2 px-3 rounded-lg bg-indigo-500 hover:bg-indigo-600 col-span-2">♻️ Reinvestir Lucros</button>
        </div>
      </div>

      <div class="bg-slate-700 p-3 rounded-lg">
        <label class="text-sm text-slate-300">Stop-loss (%)</label>
        <div class="mt-2 flex items-center gap-3">
          <input id="stop-input" type="range" min="1" max="100" value="20" class="w-full" />
          <div id="stop-value" class="w-12 text-right">20%</div>
        </div>
        <button id="btn-set-stop" class="mt-3 w-full py-2 rounded-lg bg-yellow-500 hover:bg-yellow-600">⚠️ Aplicar Stop-Loss</button>
      </div>

    </div>
  </section>

  <!-- Middle: chart -->
  <section class="md:col-span-2 bg-slate-800 rounded-2xl p-4 shadow-lg">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold">Gráfico de Lucro (Últimas 30 medidas)</h2>
      <div class="text-sm text-slate-400">Atualiza a cada 5s</div>
    </div>
    <canvas id="pnlChart" class="w-full h-64 bg-slate-900 rounded-lg p-3"></canvas>

    <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-700 p-3 rounded-lg">
        <h3 class="text-sm text-slate-300 mb-2">Logs Recentes</h3>
        <div id="logs" class="log-box text-sm text-slate-200 space-y-2"></div>
      </div>

      <div class="bg-slate-700 p-3 rounded-lg">
        <h3 class="text-sm text-slate-300 mb-2">Últimas Ações</h3>
        <ul id="actions" class="text-sm text-slate-200 list-disc pl-5"></ul>
      </div>
    </div>
  </section>
</main>

<footer class="max-w-6xl mx-auto mt-6 text-center text-slate-500 text-sm">Traidbolt • Painel local</footer>

  </div>  <script>
    // Simple frontend that polls /api/status and /api/logs
    const POLL = 5000;

    const balanceEl = document.getElementById('balance');
    const pnlEl = document.getElementById('pnl');
    const autostatus = document.getElementById('autostatus');
    const connIp = document.getElementById('conn-ip');
    const logsEl = document.getElementById('logs');
    const actionsEl = document.getElementById('actions');

    // Chart setup
    const ctx = document.getElementById('pnlChart').getContext('2d');
    const chartData = { labels: [], datasets: [{ label: 'PnL (%)', data: [], tension: 0.3, fill: false, borderWidth: 2 }] };
    const pnlChart = new Chart(ctx, { type: 'line', data: chartData, options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { beginAtZero: true } } } });

    function addPoint(value){
      const max = 30;
      if (chartData.labels.length >= max) { chartData.labels.shift(); chartData.datasets[0].data.shift(); }
      const label = new Date().toLocaleTimeString();
      chartData.labels.push(label);
      chartData.datasets[0].data.push(value);
      pnlChart.update();
    }

    async function fetchStatus(){
      try{
        const res = await fetch('/api/status');
        if(!res.ok) throw new Error('status error');
        const data = await res.json();
        balanceEl.textContent = (data.balance ?? 0).toFixed(6) + ' ' + (data.symbol ?? 'SOL');
        pnlEl.textContent = ((data.pnl_percent ?? 0).toFixed(2)) + '%';
        autostatus.textContent = data.autotrade ? 'ON' : 'OFF';
        connIp.textContent = data.ip || location.hostname;
        addPoint(data.pnl_percent ?? 0);
      }catch(e){ console.warn('fetchStatus', e); }
    }

    async function fetchLogs(){
      try{
        const res = await fetch('/api/logs');
        if(!res.ok) throw new Error('logs error');
        const data = await res.json();
        logsEl.innerHTML = '';
        (data.logs||[]).slice().reverse().slice(0,20).forEach(line=>{
          const div = document.createElement('div'); div.textContent = line; logsEl.appendChild(div);
        });
        actionsEl.innerHTML = '';
        (data.actions||[]).slice(0,8).forEach(a=>{ const li=document.createElement('li'); li.textContent = a; actionsEl.appendChild(li); });
      }catch(e){ console.warn('fetchLogs', e); }
    }

    // Controls
    document.getElementById('btn-start').onclick = async ()=>{ await fetch('/api/start',{method:'POST'}); };
    document.getElementById('btn-stop').onclick = async ()=>{ await fetch('/api/stop',{method:'POST'}); };
    document.getElementById('btn-reinvest').onclick = async ()=>{ await fetch('/api/reinvest',{method:'POST'}); };
    const stopInput = document.getElementById('stop-input');
    stopInput.oninput = ()=>{ document.getElementById('stop-value').textContent = stopInput.value + '%'; };
    document.getElementById('btn-set-stop').onclick = async ()=>{
      const v = Number(stopInput.value);
      await fetch('/api/set_stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stop_percent:v})});
    };

    // Polling
    setInterval(()=>{ fetchStatus(); fetchLogs(); }, POLL);
    // initial
    fetchStatus(); fetchLogs();
  </script></body>
</html>
