<!-- Painel Traidbolt Reescrito com UI Premium + SSE + Tailwind + Gráficos -->
<!doctype html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Traidbolt — Painel Novo</title>

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: { shimmer: "shimmer 1.5s infinite" },
          keyframes: {
            shimmer: {
              '0%': { backgroundPosition: '-500px 0' },
              '100%': { backgroundPosition: '500px 0' }
            }
          }
        }
      }
    };
  </script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100">
  <div class="min-h-screen flex flex-col">
    <!-- NAVBAR -->
    <nav class="bg-slate-800 px-6 py-3 shadow-lg flex justify-between items-center">
      <h1 class="text-xl font-bold">⚡ Traidbolt Painel (Nova Geração)</h1>
      <div class="flex items-center gap-4">
        <span id="conn-ip" class="text-sm text-slate-400">IP: —</span>
        <button id="toggle-theme" class="px-3 py-1 rounded-xl bg-slate-700">🌙/☀️</button>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto w-full p-6 grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow">

      <!-- COLUNA ESQUERDA -->
      <section class="bg-slate-800 p-5 rounded-2xl shadow-xl space-y-5">

        <!-- Saldo -->
        <div class="p-4 bg-slate-700 rounded-xl">
          <div class="text-sm text-slate-300">Saldo Atual</div>
          <div id="balance" class="text-3xl font-bold mt-1 animate-pulse bg-slate-600 h-8 w-40 rounded-lg"></div>
        </div>

        <!-- PnL -->
        <div class="p-4 bg-slate-700 rounded-xl">
          <div class="text-sm text-slate-300">Lucro Diário</div>
          <div id="pnl" class="text-2xl font-semibold mt-1 text-emerald-400 animate-pulse bg-slate-600 h-6 w-24 rounded-lg"></div>
        </div>

        <!-- Auto Trade -->
        <div class="p-4 bg-slate-700 rounded-xl">
          <div class="flex justify-between items-center">
            <span class="text-sm">Auto Trade</span>
            <span id="autostatus" class="px-2 py-1 rounded-full text-xs bg-red-500">OFF</span>
          </div>
          <div class="grid grid-cols-2 gap-3 mt-4">
            <button id="btn-start" class="py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600">▶️ Iniciar</button>
            <button id="btn-stop" class="py-2 rounded-xl bg-rose-500 hover:bg-rose-600">⏸️ Parar</button>
            <button id="btn-reinvest" class="col-span-2 py-2 rounded-xl bg-indigo-500 hover:bg-indigo-600">♻️ Reinvestir</button>
          </div>
        </div>

        <!-- Stop-Loss -->
        <div class="p-4 bg-slate-700 rounded-xl">
          <label class="text-sm text-slate-300">Stop-Loss</label>
          <div class="flex items-center gap-3 mt-2">
            <input id="stop-input" type="range" min="1" max="100" value="20" class="w-full" />
            <span id="stop-value">20%</span>
          </div>
          <button id="btn-set-stop" class="mt-3 w-full py-2 rounded-xl bg-yellow-500 hover:bg-yellow-600">Aplicar</button>
        </div>

      </section>

      <!-- COLUNA GRÁFICO -->
      <section class="md:col-span-2 bg-slate-800 p-5 rounded-2xl shadow-xl">
        <h2 class="text-lg font-bold mb-4">Gráfico — PnL (%)</h2>
        <canvas id="pnlChart" class="w-full h-72"></canvas>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
          <!-- Logs -->
          <div class="p-4 bg-slate-700 rounded-xl">
            <h3 class="font-semibold mb-2">Logs Recentes</h3>
            <div id="logs" class="h-48 overflow-y-auto space-y-1 text-sm"></div>
          </div>

          <!-- Ações -->
          <div class="p-4 bg-slate-700 rounded-xl">
            <h3 class="font-semibold mb-2">Últimas Ações</h3>
            <ul id="actions" class="text-sm list-disc pl-4"></ul>
          </div>
        </div>
      </section>

    </main>

    <footer class="text-center text-slate-500 p-4 text-sm">Traidbolt — Nova Interface</footer>
  </div>

<script>
// Toggle tema
const html = document.documentElement;
document.getElementById("toggle-theme").onclick = () => {
  html.classList.toggle("dark");
};

// Elementos
const balanceEl = document.getElementById("balance");
const pnlEl = document.getElementById("pnl");
const autostatus = document.getElementById("autostatus");
const connIp = document.getElementById("conn-ip");
const logsEl = document.getElementById("logs");
const actionsEl = document.getElementById("actions");

// Gráfico
const ctx = document.getElementById('pnlChart').getContext('2d');
const chartData = { labels: [], datasets: [{ label: 'PnL (%)', data: [], borderWidth: 3 }] };
const pnlChart = new Chart(ctx, { type: 'line', data: chartData });

function addPoint(v) {
  const max = 30;
  if(chartData.labels.length >= max) {
    chartData.labels.shift();
    chartData.datasets[0].data.shift();
  }
  chartData.labels.push(new Date().toLocaleTimeString());
  chartData.datasets[0].data.push(v);
  pnlChart.update();
}

// SSE — Atualização em tempo real
const evt = new EventSource('/api/stream');

evt.onmessage = e => {
  const data = JSON.parse(e.data);

  balanceEl.textContent = data.balance.toFixed(6) + ' SOL';
  balanceEl.classList.remove('animate-pulse','bg-slate-600');

  pnlEl.textContent = data.pnl_percent.toFixed(2) + '%';
  pnlEl.classList.remove('animate-pulse','bg-slate-600');

  autostatus.textContent = data.autotrade ? "ON" : "OFF";
  autostatus.className = data.autotrade ? "px-2 py-1 rounded-full text-xs bg-emerald-500" : "px-2 py-1 rounded-full text-xs bg-red-500";

  connIp.textContent = data.ip;

  addPoint(data.pnl_percent);

  logsEl.innerHTML = data.logs.map(l => `<div>${l}</div>`).join('');
  actionsEl.innerHTML = data.actions.map(a => `<li>${a}</li>`).join('');
};

// Controles
btn-start.onclick = () => fetch('/api/start',{method:'POST'});
btn-stop.onclick = () => fetch('/api/stop',{method:'POST'});
btn-reinvest.onclick = () => fetch('/api/reinvest',{method:'POST'});
stop-input.oninput = () => stop-value.textContent = stop-input.value + "%";
btn-set-stop.onclick = () => fetch('/api/set_stop',{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stop_percent:Number(stop-input.value)})});
</script>
</body>
</html>
